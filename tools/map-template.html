<!DOCTYPE html>
<!-- @map role: Шаблон визуальной карты: граф с панорамированием, зумом, поиском и подробностями по клику.  @map status: ready  @map layer: tools -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PardDefender — карта проекта</title>
<style>
:root {
    --bg: #16181c;
    --surface: #1e2126;
    --surface-2: #262a30;
    --line: #343941;
    --text: #dfe3e8;
    --dim: #8b939e;
}
* { box-sizing: border-box; }
html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
#app { display: flex; height: 100%; }

/* ------------------------------------------------------------------ chrome */
#side {
    width: 320px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--surface);
}
#head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
#head h1 { margin: 0 0 3px; font-size: 15px; letter-spacing: .02em; }
#head .meta { color: var(--dim); font-size: 11px; }

#search {
    margin: 10px 16px; padding: 6px 9px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); font: inherit;
}
#search:focus { outline: none; border-color: #5b8fd0; }

#filters { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
    padding: 3px 8px; border-radius: 11px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer;
    font: inherit; font-size: 11px;
}
.chip:hover { color: var(--text); }
.chip.on { border-color: currentColor; }

#detail { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px 20px; }
#detail h2 { margin: 0 0 2px; font-size: 14px; }
#detail .path { color: var(--dim); font-size: 11px; word-break: break-all; margin-bottom: 10px; }
#detail .role { margin: 10px 0; line-height: 1.55; }
#detail .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; margin: 0 5px 5px 0;
}
#detail h3 {
    margin: 16px 0 6px; font-size: 10px; letter-spacing: .12em;
    color: var(--dim); text-transform: uppercase; font-weight: 600;
}
#detail ul { margin: 0; padding-left: 16px; }
#detail li { margin-bottom: 3px; cursor: pointer; }
#detail li:hover { color: #fff; text-decoration: underline; }
#detail .empty { color: var(--dim); }
#legend { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 11px; }
#legend div { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; color: var(--dim); }
#legend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ------------------------------------------------------------------ canvas */
#canvas { flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab; }
#canvas.dragging { cursor: grabbing; }
#hint {
    position: absolute; left: 14px; bottom: 12px; color: var(--dim);
    font-size: 11px; pointer-events: none;
}
#zoombar { position: absolute; right: 14px; top: 12px; display: flex; gap: 5px; }
#zoombar button {
    width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); cursor: pointer; font: inherit;
}
#zoombar button:hover { border-color: #5b8fd0; }
#zoombar button.wide { width: auto; padding: 0 9px; }

.node rect.box { stroke-width: 1; }
.node text.title { font-size: 12px; font-weight: 600; fill: var(--text); }
.node text.sub { font-size: 10px; fill: var(--dim); }
.node { cursor: pointer; }
.node.dim { opacity: .18; }
.node.sel rect.box { stroke-width: 2; }
.edge { fill: none; stroke-width: 1.2; }
.edge.dim { opacity: .07; }
.edge.hot { stroke-width: 2; opacity: 1; }
</style>
</head>
<body>
<div id="app">
    <div id="side">
        <div id="head">
            <h1>PardDefender</h1>
            <div class="meta" id="meta"></div>
        </div>
        <input id="search" type="text" placeholder="Поиск по имени или описанию…">
        <div id="filters"></div>
        <div id="detail"><div class="empty">Выберите узел на схеме.</div></div>
        <div id="legend"></div>
    </div>
    <div id="canvas">
        <div id="zoombar">
            <button id="zin" title="Приблизить">+</button>
            <button id="zout" title="Отдалить">−</button>
            <button id="zfit" class="wide" title="Вписать">Вписать</button>
        </div>
        <div id="hint">Тяните мышью — сдвиг · Колесо — масштаб · Клик по узлу — подробности</div>
        <svg id="svg"></svg>
    </div>
</div>

<script>
var DATA = /*__MAP_DATA__*/null;

(function () {
    "use strict";

    var svg = document.getElementById("svg");
    var canvas = document.getElementById("canvas");
    var NS = "http://www.w3.org/2000/svg";

    var byId = {};
    DATA.nodes.forEach(function (n) { byId[n.id] = n; });

    var selected = null;
    var activeLayers = {};
    Object.keys(DATA.layers).forEach(function (k) { activeLayers[k] = true; });
    var query = "";

    var view = { x: 0, y: 0, k: 1 };

    /* ------------------------------------------------------------- drawing */

    function el(name, attrs) {
        var node = document.createElementNS(NS, name);
        Object.keys(attrs || {}).forEach(function (k) {
            node.setAttribute(k, attrs[k]);
        });
        return node;
    }

    var root = el("g", {});
    svg.appendChild(root);

    var defs = el("defs", {});
    svg.appendChild(defs);
    ["#4b535e", "#5b8fd0", "#5ab552", "#c9822e"].forEach(function (color, i) {
        var marker = el("marker", {
            id: "arrow" + i, viewBox: "0 0 8 8", refX: "7", refY: "4",
            markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse"
        });
        marker.appendChild(el("path", { d: "M0,0 L8,4 L0,8 z", fill: color }));
        defs.appendChild(marker);
    });

    var KIND = {
        loads: { color: "#5b8fd0", marker: "arrow1", label: "загружает" },
        uses: { color: "#4b535e", marker: "arrow0", label: "использует" },
        calls: { color: "#c9822e", marker: "arrow3", label: "вызывает" },
        covers: { color: "#5ab552", marker: "arrow2", label: "покрывает тестом" }
    };

    var headingLayer = el("g", {});
    var edgeLayer = el("g", {});
    var nodeLayer = el("g", {});
    root.appendChild(headingLayer);
    root.appendChild(edgeLayer);
    root.appendChild(nodeLayer);

    /* Column captions: the graph should be readable before anything is clicked. */
    (DATA.headings || []).forEach(function (h) {
        var text = el("text", {
            x: h.x, y: h.y, fill: h.color,
            "font-size": "12", "font-weight": "600",
            "letter-spacing": "0.08em"
        });
        text.textContent = h.title.toUpperCase() + "  (" + h.count + ")";
        headingLayer.appendChild(text);
        headingLayer.appendChild(el("line", {
            x1: h.x, y1: h.y + 8, x2: h.x + 196, y2: h.y + 8,
            stroke: h.color, "stroke-opacity": "0.3"
        }));
    });

    /* A gentle S-curve reads far better than a straight line once a few dozen
       edges overlap, and it makes direction obvious without reading the arrow. */
    function curve(a, b) {
        var x1 = a.x + a.w, y1 = a.y + a.h / 2;
        var x2 = b.x, y2 = b.y + b.h / 2;
        if (b.x < a.x) { x1 = a.x; x2 = b.x + b.w; }
        var dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
        return "M" + x1 + "," + y1 +
            " C" + (x1 + (x2 > x1 ? dx : -dx)) + "," + y1 +
            " " + (x2 - (x2 > x1 ? dx : -dx)) + "," + y2 +
            " " + x2 + "," + y2;
    }

    var edgeEls = [], nodeEls = {};

    DATA.edges.forEach(function (e) {
        var a = byId[e.from], b = byId[e.to];
        if (!a || !b) return;
        var kind = KIND[e.kind] || KIND.uses;
        var p = el("path", {
            class: "edge", d: curve(a, b), stroke: kind.color,
            "marker-end": "url(#" + kind.marker + ")"
        });
        edgeLayer.appendChild(p);
        edgeEls.push({ el: p, edge: e });
    });

    DATA.nodes.forEach(function (n) {
        var g = el("g", { class: "node", transform: "translate(" + n.x + "," + n.y + ")" });
        var layer = DATA.layers[n.layer] || { color: "#6c6c6c", title: n.layer };
        var status = DATA.status[n.status] || { color: "#6c6c6c", title: n.status };

        g.appendChild(el("rect", {
            class: "box", width: n.w, height: n.h, rx: 6,
            fill: "#1e2126", stroke: layer.color
        }));
        g.appendChild(el("rect", {
            width: 4, height: n.h, rx: 2, fill: layer.color
        }));

        var title = el("text", { class: "title", x: 14, y: 24 });
        title.textContent = n.name.length > 24 ? n.name.substring(0, 23) + "…" : n.name;
        g.appendChild(title);

        var sub = el("text", { class: "sub", x: 14, y: 42 });
        sub.textContent = layer.title.replace(/\s*\(.*$/, "") + " · " + n.lines + " стр.";
        g.appendChild(sub);

        g.appendChild(el("circle", {
            cx: n.w - 13, cy: 16, r: 4.5, fill: status.color
        }));

        g.onclick = function (event) { event.stopPropagation(); select(n.id); };
        nodeLayer.appendChild(g);
        nodeEls[n.id] = g;
    });

    /* ----------------------------------------------------------- selection */

    function select(id) {
        selected = (selected === id) ? null : id;
        paint();
        renderDetail();
    }

    function visible(n) {
        if (!activeLayers[n.layer]) return false;
        if (!query) return true;
        var haystack = (n.name + " " + n.role + " " + n.id).toLowerCase();
        return haystack.indexOf(query) >= 0;
    }

    function paint() {
        var related = {};
        if (selected) {
            related[selected] = true;
            DATA.edges.forEach(function (e) {
                if (e.from === selected) related[e.to] = true;
                if (e.to === selected) related[e.from] = true;
            });
        }

        DATA.nodes.forEach(function (n) {
            var g = nodeEls[n.id];
            var show = visible(n) && (!selected || related[n.id]);
            g.setAttribute("class", "node" + (show ? "" : " dim") +
                (n.id === selected ? " sel" : ""));
        });

        edgeEls.forEach(function (item) {
            var e = item.edge;
            var touches = selected && (e.from === selected || e.to === selected);
            var shown = visible(byId[e.from]) && visible(byId[e.to]);
            item.el.setAttribute("class", "edge" +
                (touches ? " hot" : (selected || !shown ? " dim" : "")));
        });
    }

    function renderDetail() {
        var box = document.getElementById("detail");
        if (!selected) {
            box.innerHTML = '<div class="empty">Выберите узел на схеме.</div>';
            return;
        }
        var n = byId[selected];
        var layer = DATA.layers[n.layer] || { color: "#6c6c6c", title: n.layer };
        var status = DATA.status[n.status] || { color: "#6c6c6c", title: n.status };

        var out = [];
        out.push("<h2>" + esc(n.name) + "</h2>");
        out.push('<div class="path">' + esc(n.id) + "</div>");
        out.push('<span class="badge" style="background:' + layer.color +
            '22;color:' + layer.color + '">' + esc(layer.title) + "</span>");
        out.push('<span class="badge" style="background:' + status.color +
            '22;color:' + status.color + '">' + esc(status.title) + "</span>");
        out.push('<span class="badge" style="background:#2a2f36;color:#8b939e">' +
            n.lines + " строк</span>");
        out.push('<div class="role">' +
            (n.role ? esc(n.role)
                : '<span class="empty">Описание не задано. Добавьте блок ' +
                  "<code>@map</code> в шапку файла.</span>") + "</div>");
        if (n.note) out.push('<div class="role">' + esc(n.note) + "</div>");

        var out1 = DATA.edges.filter(function (e) { return e.from === n.id; });
        var in1 = DATA.edges.filter(function (e) { return e.to === n.id; });

        if (out1.length) {
            out.push("<h3>Использует</h3><ul>");
            out1.forEach(function (e) {
                out.push('<li data-go="' + esc(e.to) + '">' +
                    esc(byId[e.to].name) + " — " + (KIND[e.kind] || KIND.uses).label + "</li>");
            });
            out.push("</ul>");
        }
        if (in1.length) {
            out.push("<h3>Используется в</h3><ul>");
            in1.forEach(function (e) {
                out.push('<li data-go="' + esc(e.from) + '">' +
                    esc(byId[e.from].name) + " — " + (KIND[e.kind] || KIND.uses).label + "</li>");
            });
            out.push("</ul>");
        }
        if (!out1.length && !in1.length) {
            out.push('<h3>Связи</h3><div class="empty">Ни от чего не зависит и ' +
                "ничем не используется.</div>");
        }

        box.innerHTML = out.join("");
        Array.prototype.forEach.call(box.querySelectorAll("[data-go]"), function (li) {
            li.onclick = function () {
                selected = li.getAttribute("data-go");
                paint(); renderDetail(); centreOn(byId[selected]);
            };
        });
    }

    function esc(v) {
        return String(v || "").replace(/&/g, "&amp;")
            .replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* -------------------------------------------------------------- chrome */

    document.getElementById("meta").textContent =
        DATA.nodes.length + " файлов · " + DATA.edges.length + " связей · собрано " +
        DATA.builtAt.replace("T", " ").substring(0, 16);

    var filters = document.getElementById("filters");
    Object.keys(DATA.layers).forEach(function (key) {
        var b = document.createElement("button");
        b.className = "chip on";
        b.style.color = DATA.layers[key].color;
        b.textContent = DATA.layers[key].title.replace(/\s*\(.*$/, "");
        b.onclick = function () {
            activeLayers[key] = !activeLayers[key];
            b.className = "chip" + (activeLayers[key] ? " on" : "");
            b.style.color = activeLayers[key] ? DATA.layers[key].color : "";
            paint();
        };
        filters.appendChild(b);
    });

    var legend = document.getElementById("legend");
    var legendHtml = [];
    Object.keys(DATA.status).forEach(function (key) {
        legendHtml.push('<div><i style="background:' + DATA.status[key].color +
            '"></i>' + DATA.status[key].title + "</div>");
    });
    Object.keys(KIND).forEach(function (key) {
        legendHtml.push('<div><i style="background:' + KIND[key].color +
            '"></i>стрелка: ' + KIND[key].label + "</div>");
    });
    legend.innerHTML = legendHtml.join("");

    document.getElementById("search").oninput = function () {
        query = this.value.trim().toLowerCase();
        paint();
    };

    /* ---------------------------------------------------------- pan & zoom */

    function apply() {
        root.setAttribute("transform",
            "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")");
    }

    function fit() {
        var rect = canvas.getBoundingClientRect();
        svg.setAttribute("width", rect.width);
        svg.setAttribute("height", rect.height);

        var k = Math.min(rect.width / (DATA.width + 60),
            rect.height / (DATA.height + 60), 1);
        /*
         * The graph is much wider than it is tall, so a literal fit on a narrow
         * window shrinks the labels to nothing. Below this floor it is better to
         * stay readable and let the reader pan - that is what the whole canvas
         * is for.
         */
        view.k = Math.max(0.5, k);

        var scaledW = DATA.width * view.k;
        var scaledH = DATA.height * view.k;
        /* Centre only what actually fits; otherwise start at the left edge, so
           the host and client columns - the part that matters - are on screen. */
        view.x = scaledW <= rect.width ? (rect.width - scaledW) / 2 : 10;
        view.y = scaledH <= rect.height ? (rect.height - scaledH) / 2 : 10;
        apply();
    }

    function centreOn(n) {
        var rect = canvas.getBoundingClientRect();
        view.x = rect.width / 2 - (n.x + n.w / 2) * view.k;
        view.y = rect.height / 2 - (n.y + n.h / 2) * view.k;
        apply();
    }

    var dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("mousedown", function (e) {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        canvas.className = "dragging";
    });
    window.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        view.x += e.clientX - lastX;
        view.y += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        apply();
    });
    window.addEventListener("mouseup", function () {
        dragging = false; canvas.className = "";
    });
    canvas.addEventListener("click", function (e) {
        if (e.target === canvas || e.target === svg) { selected = null; paint(); renderDetail(); }
    });
    canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left, my = e.clientY - rect.top;
        var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        var next = Math.max(0.15, Math.min(2.5, view.k * factor));
        /* Keep the point under the cursor fixed while zooming. */
        view.x = mx - (mx - view.x) * (next / view.k);
        view.y = my - (my - view.y) * (next / view.k);
        view.k = next;
        apply();
    }, { passive: false });

    document.getElementById("zin").onclick = function () {
        view.k = Math.min(2.5, view.k * 1.2); apply();
    };
    document.getElementById("zout").onclick = function () {
        view.k = Math.max(0.15, view.k / 1.2); apply();
    };
    document.getElementById("zfit").onclick = fit;
    window.addEventListener("resize", function () {
        var rect = canvas.getBoundingClientRect();
        svg.setAttribute("width", rect.width);
        svg.setAttribute("height", rect.height);
    });

    fit();
    paint();
})();
</script>
</body>
</html>
